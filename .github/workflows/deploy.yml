name: Deploy to AWS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy production stack to AWS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AWS_SSH_KEY }}

      - name: Deploy via SSH and rebuild Docker Compose
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_PROJECT_DIR: ${{ secrets.AWS_PROJECT_DIR }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${AWS_USER}@${AWS_HOST}" bash -s << 'EOF'
            set -euo pipefail
            TARGET_DIR="${AWS_PROJECT_DIR:-}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "$HOME/RepoPulse" ]; then
                TARGET_DIR="$HOME/RepoPulse"
              elif [ -d "$HOME/github_repo_analyzer" ]; then
                TARGET_DIR="$HOME/github_repo_analyzer"
              else
                echo "Project directory not found. Set AWS_PROJECT_DIR secret." >&2
                exit 1
              fi
            fi

            cd "$TARGET_DIR"
            git fetch origin master
            git checkout master
            git pull --ff-only origin master

            ENV_ARG=""
            if [ -f ".env.prod" ]; then
              ENV_ARG="--env-file .env.prod"
            fi

            docker compose -f docker-compose.prod.yml $ENV_ARG up -d --build
            docker image prune -f
          EOF

      - name: Verify live health endpoint
        run: |
          sleep 10
          curl -fsS --retry 5 --retry-delay 5 https://repo.b3mug1.dev/api/v1/health
